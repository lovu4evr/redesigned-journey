name: Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ApexPrime.zip
        run: unzip -o ApexPrime.zip

      - name: Auto-fix Kotlin errors
        run: |
          python3 - << 'EOF'
          import re

          # Fix 1: Cleanly add animation.core.* right after package declaration in ChatScreen.kt
          p1 = "ApexPrime/app/src/main/java/com/apexprime/app/ui/chat/ChatScreen.kt"
          txt1 = open(p1).read()
          txt1 = re.sub(
              r"(package\s+[^\n]+\n)",
              r"\1import androidx.compose.animation.core.*\n",
              txt1,
              count=1
          )
          open(p1, "w").write(txt1)

          # Fix 2: Fix 'it' reference on line 47 of ChatViewModel.kt
          p2 = "ApexPrime/app/src/main/java/com/apexprime/app/ui/chat/ChatViewModel.kt"
          lines = open(p2).read().splitlines()
          for i in range(max(0, 38), min(len(lines), 47)):
              m = re.search(r"\{\s*([a-zA-Z0-9_]+)\s*->", lines[i])
              if m:
                  param = m.group(1)
                  lines[46] = re.sub(r"\bit\b", param, lines[46])
                  break
          else:
              lines[46] = re.sub(r"\bit\.message\b", "\"Error\"", lines[46])
              lines[46] = re.sub(r"\bit\b", "Exception(\"Error\")", lines[46])
          open(p2, "w").write("\n".join(lines) + "\n")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ./ApexPrime
        run: gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexPrime-APK
          path: ApexPrime/app/build/outputs/apk/debug/app-debug.apk
          
